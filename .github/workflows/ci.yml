name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node (JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI dependencies (hardware-free)
        run: python -m pip install -r requirements-ci.txt

      - name: Compile, import, test, JS syntax, security, synthetic evaluation
        env:
          PYTHON: python
        run: bash scripts/ci_check.sh

      # Camera / model tests need real hardware and are reported as
      # SKIPPED: HARDWARE_REQUIRED by pytest above; they are never faked green.
