<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình giả lập Ứng dụng Di động FocusGuard</title>
    <!-- Google Fonts -->
    <link href="/static/css/outfit.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/static/css/all.min.css">
    <!-- Custom CSS reset and mobile styling -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Mobile Frame Status Bar overlay */
        .status-bar {
            height: 38px;
            padding: 12px 24px 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            background-color: #0b0f19;
            z-index: 100;
        }
        .status-bar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Container & Tabs */
        .app-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem 1.25rem 5rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }

        /* Header UI */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }
        .app-header h4 {
            font-weight: 700;
            font-size: 1.3rem;
            color: #fff;
        }
        .app-header span {
            font-size: 0.75rem;
            background-color: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Score Display Card */
        .score-circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            text-align: center;
        }
        .score-val {
            font-size: 3.5rem;
            font-weight: 800;
            color: #3b82f6;
            line-height: 1;
            margin-bottom: 4px;
        }
        .score-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-pill {
            margin-top: 1rem;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Mobile Stats Cards */
        .mobile-card {
            background-color: #1e293b;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .mobile-card-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            background-color: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .mobile-card-icon.danger {
            background-color: rgba(239, 110, 110, 0.15);
            color: #ef4444;
        }
        .mobile-card-icon.success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }
        .mobile-card-details h6 {
            font-size: 0.78rem;
            color: #94a3b8;
            font-weight: 500;
            text-transform: uppercase;
        }
        .mobile-card-details h4 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }

        /* Logs screen */
        .log-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .log-item {
            background-color: #111827;
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 4px solid #f59e0b;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .log-item.danger { border-left-color: #ef4444; }
        .log-item.info { border-left-color: #10b981; }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-title { font-weight: 600; font-size: 0.85rem; color: #fff; }
        .log-time { font-size: 0.72rem; color: #6b7280; }
        .log-desc { font-size: 0.78rem; color: #9ca3af; }

        /* Coach panel */
        .coach-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(15, 23, 42, 0.4) 100%);
            border: 1px solid rgba(59, 130, 246, 0.25);
            padding: 1.25rem;
            border-radius: 20px;
        }
        .coach-text {
            font-size: 0.85rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        /* Bottom Tab Navigator */
        .bottom-nav {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #64748b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            width: 20%;
            height: 100%;
            transition: color 0.2s;
        }
        .tab-btn i {
            font-size: 1.25rem;
        }
        .tab-btn span {
            font-size: 0.65rem;
            font-weight: 500;
        }
        .tab-btn.active {
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <!-- Phone Status Bar Mock -->
    <div class="status-bar">
        <span id="phone-time">15:47</span>
        <div class="status-bar-right">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-battery-three-quarters"></i>
        </div>
    </div>

    <!-- Scrollable Screen Content (all values loaded from the server; "—" = no data) -->
    <div class="app-content">
        <div class="tab-panel active" id="tab-home">
            <div class="app-header">
                <h4>Bảng điều khiển</h4>
                <span>Dữ liệu thật</span>
            </div>
            <div class="score-circle-container mt-3">
                <div class="score-val" id="mob-score">—</div>
                <div class="score-label" id="mob-score-label">Điểm tập trung</div>
                <div class="status-pill"><span id="mob-status">Chưa có dữ liệu</span></div>
            </div>
            <div class="row mt-3 d-flex flex-column gap-3">
                <div class="mobile-card">
                    <div class="mobile-card-icon"><i class="fa-solid fa-hourglass-half"></i></div>
                    <div class="mobile-card-details"><h6>Thời lượng tự học tích luỹ</h6><h4 id="mob-total-time">—</h4></div>
                </div>
                <div class="mobile-card">
                    <div class="mobile-card-icon danger"><i class="fa-solid fa-circle-exclamation"></i></div>
                    <div class="mobile-card-details"><h6>Sự kiện hành vi (phiên hiện tại)</h6><h4 id="mob-distractions">—</h4></div>
                </div>
            </div>
        </div>

        <div class="tab-panel" id="tab-analytics">
            <div class="app-header"><h4>Phân tích</h4></div>
            <div class="mobile-card">
                <div class="mobile-card-icon danger"><i class="fa-solid fa-shoe-prints"></i></div>
                <div class="mobile-card-details"><h6>Rời chỗ (phiên hiện tại)</h6><h4 id="mob-seat-leaving">—</h4></div>
            </div>
            <div class="mobile-card mt-3">
                <div class="mobile-card-icon"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="mobile-card-details"><h6>Chuyên cần (buổi học lớp)</h6><h4 id="mob-attendance">—</h4></div>
            </div>
        </div>

        <div class="tab-panel" id="tab-logs">
            <div class="app-header"><h4>Buổi học gần đây</h4></div>
            <div class="log-container mt-2" id="mob-logs"><p class="log-desc">Chưa có dữ liệu.</p></div>
        </div>

        <div class="tab-panel" id="tab-coach">
            <div class="app-header"><h4>Gợi ý khung giờ</h4></div>
            <div class="coach-box mt-2"><p class="coach-text" id="mob-coach">Không đủ dữ liệu.</p></div>
        </div>
    </div>

    <!-- Bottom Navigation Bar Mock -->
    <div class="bottom-nav">
        <button class="tab-btn active" onclick="switchTab('home', this)">
            <i class="fa-solid fa-house"></i>
            <span>Trang chủ</span>
        </button>
        <button class="tab-btn" onclick="switchTab('analytics', this)">
            <i class="fa-solid fa-chart-bar"></i>
            <span>Phân tích</span>
        </button>
        <button class="tab-btn" onclick="switchTab('logs', this)">
            <i class="fa-solid fa-bell"></i>
            <span>Nhật ký</span>
        </button>
        <button class="tab-btn" onclick="switchTab('coach', this)">
            <i class="fa-solid fa-lightbulb"></i>
            <span>Gợi ý</span>
        </button>
    </div>

    <!-- Scripts -->
    <script>
        // System Clock Mock
        function updateClock() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('phone-time').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Switch screen tabs
        function switchTab(tabId, el) {
            const panels = document.querySelectorAll('.tab-panel');
            panels.forEach(p => p.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        const esc = v => String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        async function getJson(url) {
            const res = await fetch(url);
            if (!res.ok) return null;
            return res.json();
        }
        async function fetchLiveStats() {
            try {
                const live = await getJson('/api/stats');   // students only; parents get 403
                if (live && live.is_active) {
                    document.getElementById('mob-score').innerText = live.focus_score === null ? '—' : live.focus_score;
                    document.getElementById('mob-score-label').innerText = 'Điểm tập trung hiện tại';
                    document.getElementById('mob-status').innerText = (live.labels && live.labels.focus) || 'Chưa có dữ liệu';
                    document.getElementById('mob-distractions').innerText = live.distractions + ' lần';
                    document.getElementById('mob-seat-leaving').innerText = live.seat_leaving_count + ' lần (' + Math.round(live.seat_leaving_duration / 60) + ' phút)';
                    return;
                }
                const profile = await getJson('/api/student/profile');
                if (profile) {
                    document.getElementById('mob-score').innerText = profile.average_focus_score === null ? '—' : profile.average_focus_score;
                    document.getElementById('mob-score-label').innerText = 'Điểm tập trung trung bình';
                    document.getElementById('mob-status').innerText = profile.status === 'ok' ? `${profile.total_sessions} phiên đã hoàn thành` : 'Không đủ dữ liệu';
                    const secs = profile.total_duration_seconds || 0;
                    document.getElementById('mob-total-time').innerText = `${Math.floor(secs / 3600)}g ${Math.floor((secs % 3600) / 60)}p`;
                }
            } catch (e) { /* keep "—" */ }
        }
        async function fetchHistory() {
            try {
                const att = await getJson('/api/student/attendance_history');
                if (Array.isArray(att) && att.length) {
                    const attended = att.filter(a => !a.missed).length;
                    document.getElementById('mob-attendance').innerText = `${attended}/${att.length} buổi`;
                    const labels = { PRESENT: 'Có mặt', LATE: 'Đi muộn', ABSENT: 'Vắng mặt' };
                    document.getElementById('mob-logs').innerHTML = att.slice(0, 8).map(a => `
                        <div class="log-item ${a.missed ? 'danger' : 'info'}">
                            <div class="log-header"><span class="log-title">${labels[a.attendance_status] || esc(a.attendance_status)}</span>
                            <span class="log-time">${esc(a.started_at)}</span></div>
                            <p class="log-desc">Điểm TB: ${a.focus_score === null ? 'N/A' : a.focus_score}</p>
                        </div>`).join('');
                }
                const rec = await getJson('/api/student/recommendations');
                if (rec && rec.text) document.getElementById('mob-coach').innerText = rec.text;
            } catch (e) { /* keep defaults */ }
        }
        setInterval(fetchLiveStats, 3000);
        fetchLiveStats();
        fetchHistory();
    </script>
</body>
</html>
